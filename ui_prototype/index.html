<!DOCTYPE html>
<html>
    <head>
        <title>漢字トレ「かなと漢字トレーニング」</title>
        <link rel="stylesheet" href="style.css"/>
        <script defer type="text/javascript" src="ui.js"></script>
        <script defer type="text/javascript" src="script.js"></script>
    </head>
    <body>
        <div class="fade-hidden" id="level-up-container">
            <div class="level-up" id="level-up-text">
                Level Up!!!123
            </div>
            <div class="level-up" id="level-up-hint">
                <div id="level-up-hint-panel">
                    <button class="control-button" id="level-up-hint-close-button">Close</button>
                </div>
                <!-- Newest hint -->
                 <div id="level-up-hint-content">
                     Level Up!!!<br>New hint!<br><br><br><br><br><br><br><br>
                     Level Up!!!<br>New hint!<br><br><br><br><br><br><br><br>
                     Level Up!!!<br>New hint!
                 </div>
            </div>
            <div id="black-overlay"></div>
        </div>
        <div class="fade-hidden" id="level-exp">
            <div id="level-total-exp">
                Total EXP: 7
            </div>
            <div id="level-next-level">
                Next level: 7 / 10
            </div>
            <div id="level-name">
                Level 1: あ行
            </div>
            <div id="level-exp-bars">
                <div class="level-exp-container" id="level-current-level-exp-container">
                    <div class="level-exp-content" id="level-current-level-exp-content" style="width: 70px;"></div>
                </div>
            </div>
            <div id="level-tmp-exp-bars">
                <!-- The following divs will be created dynamically -->
                <div>Total: +2XP!</div>
                <div>
                    あ: +1XP!
                    <div class="level-exp-container">
                        <div class="level-exp-content" style="width: 50px;"></div>
                    </div>
                </div>
                <div>
                    い: +1XP!
                    <div class="level-exp-container">
                        <div class="level-exp-content" style="width: 50px;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="question">
            <div id="question-hint">
                ・ぶ・
            </div>
            <div id="question-kanji">
                出船
            </div>
        </div>
        <div id="answer">
            <div id="wrong-answer">
                てすと
            </div>
            <input id="answer-input"></input>
        </div>
        <div id="info">
            <details open class="content-group" id="meaning">
                <summary class="control-panel" id="meaning-panel">
                    Meaning
                </summary>
                <div id="meaning-content">
                    <!-- These entry divs will be dynamically created -->
                    <div class="meaning-entry">
                        1.
                        <div class="meaning-pos-container">
                            <div class="meaning-pos-entry">pos 1</div>
                            <div class="meaning-pos-entry">pos 2</div>
                        </div>
                        <div class="meaning-gloss-container">
                            <div class="meaning-gloss-entry">gloss 1</div>
                            <div class="meaning-gloss-entry">gloss 2</div>
                        </div>
                        <div class="meaning-s-inf">s_inf</div>
                        <div class="meaning-misc-container">
                            <div class="meaning-misc-entry">misc 1</div>
                            <div class="meaning-misc-entry">misc 2</div>
                        </div>
                        <div class="meaning-lsource-container">
                            <div class="meaning-lsource-entry">lsource 1</div>
                            <div class="meaning-lsource-entry">lsource 2</div>
                        </div>
                    </div>
                </div>
            </details>
            <details open class="content-group" id="hint">
                <summary class="control-panel" id="hint-panel">
                    Hint
                </summary>
                <div id="hint-collapsable-part">
                    <div id="hint-controls-panel">
                        <button class="control-button" id="hint-previous-button">Previous</button>
                        <button class="control-button" id="hint-next-button">Next</button>
                    </div>
                    <!-- The content of the below div will be vreated dynamically -->
                    <div id="hint-content">
                        <div>あ - a</div>
                        <div>い - i</div>
                        <div>う - u</div>
                        <div>え - e</div>
                        <div>お - o</div>
                    </div>
                </div>
            </details>
        </div>
    </body>
</html>
