<!DOCTYPE html>
<html>
    <head>
        <title>漢字トレ「かなと漢字トレーニング」</title>
        <link rel="stylesheet" href="style.css"/>
        <script defer type="text/javascript" src="templates.js"></script>
        <script defer type="text/javascript" src="hints.js"></script>
        <script defer type="text/javascript" src="ui.js"></script>
        <script defer type="text/javascript" src="main.js"></script>
    </head>
    <body>
        <div class="fade-hidden" id="level-up-container">
            <div class="level-up" id="level-up-text">
                <span class="jumpable level-up-text-char">L</span>
                <span class="jumpable level-up-text-char">e</span>
                <span class="jumpable level-up-text-char">v</span>
                <span class="jumpable level-up-text-char">e</span>
                <span class="jumpable level-up-text-char">l</span>
                <span>&nbsp;</span> <!-- Spaces not animated -->
                <span class="jumpable level-up-text-char">u</span>
                <span class="jumpable level-up-text-char">p</span>
                <span class="jumpable level-up-text-char">!</span>
            </div>
            <div class="level-up fade-hidden" id="level-up-hint">
                <div class="controls-panel" id="level-up-hint-panel">
                    New level!
                    <div class="buttons-panel">
                        <button class="control-button icon-button" id="level-up-hint-close-button" title="Close"><img src="icons/close.svg" alt="Close"/></button>
                    </div>
                </div>
                <!-- Newest hint -->
                 <div id="level-up-hint-content">
                    <!-- Content created dynamically -->
                 </div>
            </div>
            <div id="black-overlay"></div>
        </div>
        <div id="level-exp">
            <!-- Content created dynamically -->
        </div>
        <div id="question">
            <div id="question-hint">
                ・ぶ・
            </div>
            <div id="question-kanji">
                出船
            </div>
        </div>
        <div id="answer">
            <div id="wrong-answer">
                てすと
            </div>
            <input id="answer-input"></input>
        </div>
        <div id="info">
            <details open class="content-group" id="meaning">
                <summary class="summary-panel" id="meaning-panel">
                    Meaning
                </summary>
                <div id="meaning-content">
                    <!-- These entry divs will be dynamically created -->
                    <div class="meaning-entry">
                        1.
                        <div class="meaning-pos-container">
                            <div class="meaning-pos-entry">pos 1</div>
                            <div class="meaning-pos-entry">pos 2</div>
                        </div>
                        <div class="meaning-gloss-container">
                            <div class="meaning-gloss-entry">gloss 1</div>
                            <div class="meaning-gloss-entry">gloss 2</div>
                        </div>
                        <div class="meaning-s-inf">s_inf</div>
                        <div class="meaning-misc-container">
                            <div class="meaning-misc-entry">misc 1</div>
                            <div class="meaning-misc-entry">misc 2</div>
                        </div>
                        <div class="meaning-lsource-container">
                            <div class="meaning-lsource-entry">lsource 1</div>
                            <div class="meaning-lsource-entry">lsource 2</div>
                        </div>
                    </div>
                </div>
            </details>
            <details open class="content-group" id="hint">
                <summary class="summary-panel" id="hint-panel">
                    Hint
                </summary>
                <div id="hint-collapsible-part">
                    <div class="controls-panel" id="hint-controls-panel">
                        <div class="buttons-panel">
                            <button class="control-button icon-button" id="hint-first-button" title="First hint"><img src="icons/first_page.svg" alt="First hint"/></button>
                            <button class="control-button icon-button" id="hint-previous-button" title="Previous hint"><img src="icons/chevron_left.svg" alt="Previous hint"/></button>
                            <button class="control-button icon-button" id="hint-next-button" title="Next hint"><img src="icons/chevron_right.svg" alt="Next hint"/></button>
                            <button class="control-button icon-button" id="hint-last-button" title="Latest hint"><img src="icons/last_page.svg" alt="Latest hint"/></button>
                        </div>
                    </div>
                    <!-- The content of the below div will be vreated dynamically -->
                    <div id="hint-content">
                    </div>
                </div>
            </details>
        </div>
    </body>
</html>
