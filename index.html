<!DOCTYPE html>
<head>
    <meta charset='UTF-8'>
    <script src='wanakana.min.js'></script>
    <title>Japanese reading game prototype</title>
    <script>
        const ctx = {};
        const KANA_MODE = 0;
        const KANJI_MODE = 1;
        const SHOW_EXP_BAR = true;
        const MAIN_DICT = 'MAIN_DICT';
        const SUB_DICT = 'SUB_DICT';

        function loadData() {
            fetch('dict.json')
                .then(data => data.json())
                .then(json => startGame(json))
                .catch(err => {
                    const body = document.body;
                    body.innerHTML = err;
                    console.error(err);
                });
        }

        function startGame(dict) {
            createDicts(dict);
            const body = document.body;
            body.innerHTML = '';

            ctx.levelDiv = document.createElement('div');
            ctx.levelDiv.style.float = 'right';
            ctx.totalExpDiv = document.createElement('div');
            ctx.totalExpDiv.innerHTML = 'Total EXP: 0';
            ctx.toNextLevelExpDiv = document.createElement('div');
            ctx.levelText = document.createElement('div');
            ctx.levelText.innerHTML = `Level: ${ctx.level} ${textForLevel(ctx.level)}`;
            ctx.levelBarContainer = document.createElement('div');
            ctx.levelBarContainer.style.width = '100px';
            ctx.levelBarContainer.style.height = '10px';
            ctx.levelBarContainer.style.background = '#000';
            ctx.levelBarContent = document.createElement('div');
            ctx.levelBarContent.style.width = '0px';
            ctx.levelBarContent.style.height = '10px';
            ctx.levelBarContent.style.background = '#0f0';
            ctx.levelBarContainer.append(ctx.levelBarContent);
            ctx.expDiv = document.createElement('div');
            ctx.levelDiv.append(
                ctx.totalExpDiv,
                ctx.toNextLevelExpDiv,
                ctx.levelText,
                ctx.levelBarContainer,
                ctx.expDiv
            );

            ctx.uniqueHintDiv = document.createElement('div');
            ctx.questionDiv = document.createElement('div');
            ctx.wrongAnswerDiv = document.createElement('div');
            ctx.wrongAnswerDiv.style.color = '#f00';
            ctx.hintDiv = document.createElement('div');
            ctx.answerInput = document.createElement('input');
            ctx.answerInput.addEventListener('change', answerSubmitted);

            ctx.giveUpButton = document.createElement('button');
            ctx.giveUpButton.innerHTML = 'Give up';
            ctx.giveUpButton.addEventListener('click', () => {
                if (ctx.mode === KANA_MODE) {
                    ctx.giveUpDiv.innerHTML = wanakana.toRomaji(ctx.question.kana.reb);
                } else if (ctx.giveUp) {
                    ctx.giveUpDiv.innerHTML = `${ctx.question.kana.reb} (${wanakana.toRomaji(ctx.question.kana.reb, { customRomajiMapping: { 'ぁ': 'xa', 'ぃ': 'xi',  'ぅ': 'xu', 'ぇ': 'xe', 'ぉ': 'xo', 'ァ': 'xa', 'ィ': 'xi', 'ゥ': 'xu', 'ェ': 'xe', 'ォ': 'xo' } })})`;
                } else {
                    ctx.giveUpDiv.innerHTML = ctx.question.kana.reb;
                }
                ctx.giveUp = true;
            });
            ctx.giveUpDiv = document.createElement('div');

            body.append(
                ctx.levelDiv,
                ctx.uniqueHintDiv,
                ctx.questionDiv,
                document.createElement('br'),
                ctx.wrongAnswerDiv,
                ctx.answerInput,
                document.createElement('br'),
                ctx.giveUpButton,
                ctx.giveUpDiv,
                document.createElement('br'),
                ctx.hintDiv
            );

            ctx.totalExp = 0;
            setLevel(1);
            askRandomQuestion(ctx.currentDict, ctx.questionDiv, ctx.answerInput);
        }

        function updateScore() {
            if (ctx.giveUp) {
                return;
            }

            showExpDiv();
            let charMaxedOut = false;
            const questionChars = ctx.mode === KANJI_MODE && ctx.question.kanji
                ? ctx.question.kanji.keb
                : ctx.question.kana.reb;
            const charsForExp = ctx.currentLevelProgress.remainingChars.intersection(new Set([...questionChars]));
            
            const addedScore = ctx.level >= ctx.levelChars.length
                ? ctx.expPerChar
                : charsForExp.size * ctx.expPerChar;

            ctx.totalExp += addedScore;

            showGainedExp('Total', addedScore);
            charsForExp.forEach(char => {
                const newReps = ctx.currentLevelProgress.charsRepsMap.get(char) + 1;
                ctx.currentLevelProgress.charsRepsMap.set(char, newReps);
                if (newReps >= ctx.charRepsToLevelUp) {
                    charMaxedOut = true;
                }
                showGainedExp(char, ctx.expPerChar, SHOW_EXP_BAR);
            });

            if (charMaxedOut) {
                ctx.currentLevelProgress.remainingChars = new Set(
                    [...ctx.currentLevelProgress.remainingChars]
                        .filter(char => ctx.currentLevelProgress.charsRepsMap.get(char) < ctx.charRepsToLevelUp)
                );

                if (ctx.currentLevelProgress.remainingChars.size > 0) {
                    if (ctx.mode === KANJI_MODE && ctx.question.kanji) {
                        ctx.currentDict = ctx.currentDict.filter(filterMaxedKanji);
                    } else {
                        ctx.currentDict = ctx.currentDict.filter(filterMaxedKana);
                    }

                    if (ctx.currentDict.length === 0) {
                        ctx.currentDict = getDictForLevel(ctx.levelDicts[ctx.level - 1], SUB_DICT)
                            .filter(ctx.mode === KANJI_MODE ? filterMaxedKanji : filterMaxedKana);
                    }
                }

                charMaxedOut = false;
            }
            
            console.log(addedScore);
            if (ctx.currentLevelExp + addedScore >= ctx.expToLevelUp) {
                setLevel(ctx.level + 1);
            } else {
                ctx.currentLevelExp += addedScore;
                ctx.levelBarContent.style.width = `${ctx.currentLevelExp * ctx.levelBarContainer.clientWidth / ctx.expToLevelUp}px`;
            }

            ctx.totalExpDiv.innerHTML = `Total EXP: ${ctx.totalExp}`;
            ctx.toNextLevelExpDiv.innerHTML = `Next level: ${ctx.currentLevelExp} / ${ctx.expToLevelUp}`;
        }

        function filterMaxedKana(entry) {
            return ctx.currentLevelProgress.remainingChars
                .intersection(
                    new Set([...entry.kana.reb])
                ).size > 0;
        }

        function filterMaxedKanji(entry) {
            return entry.kanji && ctx.currentLevelProgress.remainingChars
                .intersection(
                    new Set([...entry.kanji.keb])
                ).size > 0;
        }

        function createDicts(dict) {
            ctx.dict = dict;

            const hiraganaGyous = ['a', 'n', 'm', 'r', 'k', 's', 't', 'h', 'y', 'w'];
            const katakanaGyous = hiraganaGyous.map(gyou => gyou.toUpperCase());
            ctx.gyouDicts = new Map([...hiraganaGyous, ...katakanaGyous]
                .map(gyou => [gyou, dict.filter(entry => entry.tags.includes(gyou))])
            );

            console.log(`Total: ${ctx.dict.length}`);

            const isJlptLevelWordAndKanji = (level, entry) => entry.tags.includes(`k${level}`) && entry.tags.find(tag => [5, 4, 3, 2, 1].filter(l => l >= level).map(l => `v${l}`).includes(tag));
            [5, 4, 3, 2, 1].forEach(level => {
                ctx[`jlptN${level}Kanji`] = dict.filter(entry => entry.tags.includes(`k${level}`));
                ctx[`jlptN${level}Vocab`] = dict.filter(entry => entry.tags.includes(`v${level}`));
                ctx[`jlptN${level}`] = dict.filter(entry => isJlptLevelWordAndKanji(level, entry));
            });

            const isJlptWord = (entry) => [1, 2, 3, 4, 5].find(level => entry.tags.includes(`v${level}`));
            ctx.gyouDicts.entries().forEach(([gyouDictKey, gyouDictValue]) => {
                ctx[`jlptGyou${gyouDictKey}`] = gyouDictValue.filter(entry => isJlptWord(entry));
            });

            ctx.kanjiLevelDicts = [];
            ctx.dict.forEach(entry => {
                const levelTag = entry.tags.find(tag => tag.startsWith('L'));

                if (!levelTag) {
                    return;
                }

                const level = Number(levelTag.substring(1));
                const index = level - 1;

                if (!ctx.kanjiLevelDicts[index]) {
                    ctx.kanjiLevelDicts[index] = [ entry ];
                } else {
                    ctx.kanjiLevelDicts[index].push(entry);
                }
            });

            ctx.levelDicts = [
                ...[...hiraganaGyous, ...katakanaGyous].map(gyou => ({ MAIN_DICT: ctx[`jlptGyou${gyou}`], SUB_DICT: ctx.gyouDicts.get(gyou) })),
                ...ctx.kanjiLevelDicts,
                ...[5, 4, 3, 2, 1].map(level => ctx[`jlptN${level}`]),
                ctx.dict
            ];

            const hiraganaChars = [
                'あいうえお',
                'なにぬねの',
                'まみむめも',
                'らりるれろ',
                'かきくけこがぎぐげご',
                'さしすせそざじずぜぞ',
                'たちっつてとだぢづでど',
                'はひふへほばびぶべぼぱぴぷぺぽ',
                'やゆよゃゅょ',
                'わをん'
            ];

            const katakanaChars = [
                'アイウエオ',
                'ナニヌネノ',
                'マミムメモ',
                'ラリルレロー',
                'カキクケコガギグゲゴ',
                'サシスセソザジズゼゾ',
                'タチッツテトダヂヅデドゥ',
                'ハヒフヘホバビブベボパピプペポァィェォ',
                'ヤユヨャュョ',
                'ワヲン'
            ];

            const kanjiLevelChars = [
                '日一国人年',
                '大十二本中',

                '会同事社'
            ];

            ctx.levelChars = [
                ...hiraganaChars,
                ...katakanaChars,
                ...kanjiLevelChars
            ];

            ctx.kanjiLevelChars = kanjiLevelChars;
            console.log(ctx);

            const kanaChars = [...hiraganaChars, ...katakanaChars];
            for (let i = 0; i < kanaChars.length; i++) {
                const chars = [...kanaChars[i]];
                console.log(
                    kanaChars[i],
                    chars.filter(c => !(ctx.levelDicts[i].MAIN_DICT || ctx.levelDicts[i]).find(q => [...q.kana.reb].includes(c)))
                )
            } 
        }

        function askRandomQuestion() {
            const previousQuestion = ctx.question;
            do {
                ctx.question = ctx.currentDict[Math.floor(Math.random() * ctx.currentDict.length)];
            } while(ctx.currentDict.length > 1 && previousQuestion && (previousQuestion === ctx.question || (ctx.mode === KANA_MODE && ctx.question.kana.reb === previousQuestion.kana.reb)));

            const q = ctx.question;
            ctx.uniqueHintDiv.innerHTML = formatUniqueHintDiv(q);
            ctx.questionDiv.innerHTML = formatQuestion(q);
            ctx.hintDiv.innerHTML = formatSense(q.sense);

            console.log(q);

            ctx.giveUp = false;
            ctx.giveUpDiv.innerHTML = '';

            ctx.answerInput.focus();
        }

        function formatUniqueHintDiv(question) {
            return ctx.mode === KANJI_MODE && question.hint ? question.hint : '';
        }

        function formatQuestion(question) {
            return ctx.mode === KANJI_MODE && question.kanji ? question.kanji.keb : question.kana.reb;
        }

        function formatSense(sense) {
            return sense.map(s => JSON.stringify(s, null, 1).replaceAll('\n', '<br>')).join('<br><br>');
        }

        function answerSubmitted(event) {
            const input = event.target;
            const answer = input.value;

            if (!answer) {
                return;
            }

            if (wanakana.toKatakana(ctx.question.kana.reb) === wanakana.toKatakana(answer)) {
                console.log('Correct!');
                input.value = '';
                ctx.wrongAnswerDiv.innerHTML = '';
                updateScore();
                askRandomQuestion();
            } else {
                console.log('Incorrect...');
                ctx.wrongAnswerDiv.innerHTML = wanakana.isKatakana(ctx.question.kana.reb) ? wanakana.toKatakana(answer) : wanakana.toHiragana(answer);
            }
        }

        function textForLevel(level) {
            switch(level) {
                case 1: return 'あ行';
                case 2: return 'か行';
                case 3: return 'さ行';
                case 4: return 'た行';
                case 5: return 'な行';
                case 6: return 'は行';
                case 7: return 'ま行';
                case 8: return 'や行';
                case 9: return 'ら行';
                case 10: return 'わ行';
                case 11: return 'ん行';
                case 12: return 'ア行';
                case 13: return 'カ行';
                case 14: return 'サ行';
                case 15: return 'ナ行';
                case 16: return 'ハ行';
                case 17: return 'マ行';
                case 18: return 'タ行';
                case 19: return 'ヤ行';
                case 20: return 'ラ行';
                case 21: return 'ワ行';
                case 22: return 'ン行';
                case 23:
                case 24:
                    return `JLPT N5 (${ctx.kanjiLevelChars[level - 23]})`;
                case 25:
                    return `JLPT N4 (${ctx.kanjiLevelChars[level - 23]})`;
                case 26: return 'JLPT N5';
                case 27: return 'JLPT N4';
                case 28: return 'JLPT N3';
                case 29: return 'JLPT N2';
                case 30: return 'JLPT N1';
                default: return '全部';
            }
        }

        function levelCheat(level) {
            ctx.giveUp = false;
            setLevel(level);
            askRandomQuestion();
        }

        function setLevel(level) {
            ctx.currentLevelExp = 0;
            ctx.level = level;
            ctx.levelBarContent.style.width = '0px';
            
            ctx.levelText.innerHTML = `Level: ${ctx.level} ${textForLevel(ctx.level)}`;
            
            const baseRepsToLevelUp = 2;
            const baseDictLength = 5;
            const levelDictIndex = Math.min(ctx.level - 1, ctx.levelDicts.length - 1);
            ctx.currentDict = getDictForLevel(ctx.levelDicts[levelDictIndex], MAIN_DICT);
            ctx.expPerChar = Math.max(Math.round(ctx.level * ctx.level / 2), 1);
            ctx.mode = ctx.level >= 23 ? KANJI_MODE : KANA_MODE;
            
            if (ctx.level > ctx.levelChars.length) {
                ctx.charRepsToLevelUp = baseRepsToLevelUp;
                const kanjiLevelCharsLength = baseDictLength;
                ctx.expToLevelUp = kanjiLevelCharsLength * ctx.expPerChar * ctx.charRepsToLevelUp;
                
                ctx.currentLevelProgress = {
                    remainingChars: new Set(),
                    charsRepsMap: new Map()
                }
            } else {
                ctx.charRepsToLevelUp = Math.max(Math.floor(baseRepsToLevelUp * baseDictLength / ctx.levelChars[levelDictIndex].length), 1);
                ctx.expToLevelUp = ctx.levelChars[levelDictIndex].length * ctx.expPerChar * ctx.charRepsToLevelUp;
                
                const levelCharsArray = [...ctx.levelChars[levelDictIndex]];
                ctx.currentLevelProgress = {
                    remainingChars: new Set(levelCharsArray),
                    charsRepsMap: new Map(levelCharsArray.map(char => [char, 0]))
                };
            }

            ctx.toNextLevelExpDiv.innerHTML = `Next level: ${ctx.currentLevelExp} / ${ctx.expToLevelUp}`;

            console.log(ctx.currentLevelProgress);
        }

        function getDictForLevel(levelDict, type) {
            console.log(levelDict)
            if (!Array.isArray(levelDict)) {
                const dict = levelDict[type];
                return dict.length > 0 ? dict : levelDict[SUB_DICT];
            }

            return levelDict;
        };

        function showGainedExp(char, exp, showBar) {
            if (!exp) {
                return;
            }

            const charExpTextDiv = document.createElement('div');
            charExpTextDiv.innerHTML = `${char}: +${exp}XP!`;

            if (showBar) {
                const barWidth = 100;
                const charExpBarDiv = document.createElement('div');
    
                const expBarDivContainer = document.createElement('div');
                expBarDivContainer.style.width = `${barWidth}px`;
                expBarDivContainer.style.height = '10px';
                expBarDivContainer.style.background = '#000';
    
                const expBarContent = document.createElement('div');
                expBarContent.style.width = `${barWidth * ctx.currentLevelProgress.charsRepsMap.get(char) / ctx.charRepsToLevelUp}px`;
                expBarContent.style.height = '10px';
                expBarContent.style.background = '#00f';
    
                expBarDivContainer.append(expBarContent);
    
                charExpTextDiv.append(expBarDivContainer);
            }

            ctx.expDiv.append(charExpTextDiv);
        }

        function fadeOutExpDiv() {
            ctx.expDiv.style['transition-property'] =  'opacity';
            ctx.expDiv.style['transition-duration'] =  '2s';
            ctx.expDiv.style['transition-delay'] =  '1s';
            ctx.expDiv.style.opacity = 0 
        }

        function showExpDiv() {
            ctx.expDiv.innerHTML = '';
            ctx.expDiv.style.removeProperty('transition-property');
            ctx.expDiv.style.removeProperty('transition-duration');
            ctx.expDiv.style.removeProperty('transition-delay');
            ctx.expDiv.style.removeProperty('opacity');
            setTimeout(fadeOutExpDiv, 0);
        }
    </script>
</head>
