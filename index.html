<!DOCTYPE html>
<head>
    <meta charset='UTF-8'>
    <script src='wanakana.min.js'></script>
    <title>Japanese reading game prototype</title>
    <script>
        const ctx = {};
        const KANA_MODE = 0;
        const KANJI_MODE = 1;

        function loadData() {
            fetch('dict.json')
                .then(data => data.json())
                .then(json => startGame(json))
                .catch(err => {
                    const body = document.body;
                    body.innerHTML = err;
                    console.error(err);
                });
        }

        function startGame(dict) {
            createDicts(dict);
            const body = document.body;
            body.innerHTML = '';

            ctx.questionDiv = document.createElement('div');
            ctx.answerInput = document.createElement('input');
            ctx.answerInput.addEventListener('change', answerSubmitted);

            body.append(ctx.questionDiv, document.createElement('br'), ctx.answerInput);
            askRandomQuestion(ctx.currentDict, ctx.questionDiv, ctx.answerInput);
        }

        function createDicts(dict) {
            ctx.dict = dict;

            // Kana dict isn't working anyway
            // ctx.kanaDict = dict.filter(
            //     entry => !entry.kanji ||
            //         (entry.sense.map(s => [s.misc].flatMap(m => m).includes('word usually written using kana alone')))
            // );
            // ctx.hiraganaDict = ctx.kanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb === wanakana.toHiragana(kana.reb))
            //     );
            // ctx.katakanaDict = ctx.kanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb === wanakana.toKatakana(kana.reb))
            //     );
            
            // ctx.hiraganaAGyou = ctx.hiraganaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb.match(/^[あ|い|う|え|お]+$/))
            //     )
            // ctx.katakanaAGyou = ctx.katakanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb.match(/^[ア|イ|ウ|エ|オ]+$/))
            //     )

            // ctx.hiraganaAGyou = ctx.dict.filter(entry => entry.tags.includes('a'));
            // ctx.hiraganaKaGyou = ctx.dict.filter(entry => entry.tags.includes('k'));
            // ctx.hiraganaSaGyou = ctx.dict.filter(entry => entry.tags.includes('s'));
            // ctx.katakanaAGyou = ctx.dict.filter(entry => entry.tags.includes('A'));
            // ctx.katakanaKaGyou = ctx.dict.filter(entry => entry.tags.includes('K'));
            // ctx.katakanaSaGyou = ctx.dict.filter(entry => entry.tags.includes('S'));

            const hiraganaGyous = ['a', 'k', 's', 't', 'n', 'h', 'm', 'y', 'r', 'w', 'nn'];
            const katakanaGyous = hiraganaGyous.map(g => g.toUpperCase());
            ctx.gyouDicts = new Map([...hiraganaGyous, ...katakanaGyous]
                .map(gyou => [gyou, dict.filter(entry => entry.tags.includes(gyou))])
            );

            // console.log(`Total: ${ctx.dict.length},
            // Kana: Not working!,
            // Hiragana: Not used right now,
            // Hiragana あ行: ${ctx.hiraganaAGyou.length},
            // Hiragana か行: ${ctx.hiraganaKaGyou.length},
            // Hiragana さ行: ${ctx.hiraganaSaGyou.length},
            // Katakana: Not used right now,
            // Katakana ア行: ${ctx.katakanaAGyou.length},
            // Katakana カ行: ${ctx.katakanaKaGyou.length},
            // Katakana サ行: ${ctx.katakanaSaGyou.length}`);

            console.log(`Total: ${ctx.dict.length}`);
            console.log(ctx.gyouDicts);

            [5, 4, 3, 2, 1].forEach(level => {
                ctx[`jlptN${level}Kanji`] = dict.filter(entry => entry.tags.includes(`k${level}`));
                ctx[`jlptN${level}Vocab`] = dict.filter(entry => entry.tags.includes(`v${level}`));
            });

            const isJlptWord = (entry) => [1, 2, 3, 4, 5].find(level => entry.tags.includes(`v${level}`));
            ctx.gyouDicts.entries().forEach(([gyouDictKey, gyouDictValue]) => {
                ctx[`jlptGyou${gyouDictKey}`] = gyouDictValue.filter(entry => isJlptWord(entry));
            });

            ctx.mode = KANJI_MODE;
            ctx.currentDict = ctx['jlptN5Vocab'];
        }

        function askRandomQuestion() {
            const previousQuestion = ctx.question;
            do {
                ctx.question = ctx.currentDict[Math.floor(Math.random() * ctx.currentDict.length)];
            } while(previousQuestion && (previousQuestion === ctx.question || (ctx.mode === KANA_MODE && ctx.question.kana.map(kana => kana.reb).find(reb => previousQuestion.kana.map(kana => kana.reb).includes(reb)))));

            const q = ctx.question;
            ctx.questionDiv.innerHTML = `
                ${formatQuestion(q)}
                <br>
                ${formatSense(q.sense)}
            `;

            console.log(q);
            ctx.answerInput.focus();
        }

        function formatQuestion(question) {
            const dataToFormat = ctx.mode === KANA_MODE ? question.kana : (question.kanji || question.kana); 
            return dataToFormat.map((data, index) => data.keb || data.reb).join('<br>');
        }

        function formatSense(sense) {
            return sense.flatMap(s => s).map(s => JSON.stringify(s, null, 1).replaceAll('\n', '<br>')).join('<br><br>');
        }

        function answerSubmitted(event) {
            const input = event.target;
            const answer = input.value;

            if (!answer) {
                return;
            }

            if (ctx.question.kana.map(entry => wanakana.toKatakana(entry.reb)).includes(wanakana.toKatakana(answer))) {
                console.log('Correct!');
                input.value = '';
                askRandomQuestion();
            } else {
                console.log('Incorrect...');
            }
        }
    </script>
</head>
<body onload="loadData();">

</body>
