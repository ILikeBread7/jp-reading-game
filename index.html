<!DOCTYPE html>
<head>
    <meta charset='UTF-8'>
    <script src='wanakana.min.js'></script>
    <title>Japanese reading game prototype</title>
    <script>
        const ctx = {};
        const KANA_MODE = 0;
        const KANJI_MODE = 1;

        function loadData() {
            fetch('dict.json')
                .then(data => data.json())
                .then(json => startGame(json))
                .catch(err => {
                    const body = document.body;
                    body.innerHTML = err;
                    console.error(err);
                });
        }

        function startGame(dict) {
            createDicts(dict);
            const body = document.body;
            body.innerHTML = '';

            ctx.levelDiv = document.createElement('div');
            ctx.levelDiv.style.float = 'right';
            ctx.levelText = document.createElement('span');
            ctx.levelText.innerHTML = `Level: ${ctx.level} ${textForLevel(ctx.level)}`;
            ctx.levelBarContainer = document.createElement('div');
            ctx.levelBarContainer.style.width = '100px';
            ctx.levelBarContainer.style.height = '10px';
            ctx.levelBarContainer.style.background = '#000';
            ctx.levelBarContent = document.createElement('div');
            ctx.levelBarContent.style.width = '0px';
            ctx.levelBarContent.style.height = '10px';
            ctx.levelBarContent.style.background = '#0f0';
            ctx.levelBarContainer.append(ctx.levelBarContent);
            ctx.levelDiv.append(ctx.levelText, ctx.levelBarContainer);

            ctx.questionDiv = document.createElement('div');
            ctx.answerInput = document.createElement('input');
            ctx.answerInput.addEventListener('change', answerSubmitted);

            ctx.giveUpButton = document.createElement('button');
            ctx.giveUpButton.innerHTML = 'Give up';
            ctx.giveUpButton.addEventListener('click', () => {
                if (ctx.mode === KANA_MODE) {
                    ctx.giveUpDiv.innerHTML = wanakana.toRomaji(ctx.question.kana.reb);
                } else if (ctx.giveUp) {
                    ctx.giveUpDiv.innerHTML = `${ctx.question.kana.reb} (${wanakana.toRomaji(ctx.question.kana.reb, { customRomajiMapping: { 'ぁ': 'xa', 'ぃ': 'xi',  'ぅ': 'xu', 'ぇ': 'xe', 'ぉ': 'xo', 'ァ': 'xa', 'ィ': 'xi', 'ゥ': 'xu', 'ェ': 'xe', 'ォ': 'xo' } })})`;
                } else {
                    ctx.giveUpDiv.innerHTML = ctx.question.kana.reb;
                }
                ctx.giveUp = true;
            })
            ctx.giveUpDiv = document.createElement('div');

            body.append(
                ctx.levelDiv,
                ctx.questionDiv,
                document.createElement('br'),
                ctx.answerInput,
                document.createElement('br'),
                ctx.giveUpButton,
                ctx.giveUpDiv
            );

            setLevel(1);
            askRandomQuestion(ctx.currentDict, ctx.questionDiv, ctx.answerInput);
        }

        function updateScore() {
            if (ctx.giveUp) {
                return;
            }

            const addedScore = ctx.mode === KANJI_MODE || ctx.level >= ctx.levelDicts.length
                ? 1
                : new Set([...ctx.levelChars[ctx.level - 1]]).intersection(new Set([...ctx.question.kana.reb])).size;
            
            console.log(addedScore);
            if (ctx.score + addedScore >= ctx.expToLevelUp) {
                setLevel(ctx.level + 1);
            } else {
                ctx.score += addedScore;
                ctx.levelBarContent.style.width = `${ctx.score * ctx.levelBarContainer.clientWidth / ctx.expToLevelUp}px`;
            }
        }

        function createDicts(dict) {
            ctx.dict = dict;

            // Kana dict isn't working anyway
            // ctx.kanaDict = dict.filter(
            //     entry => !entry.kanji ||
            //         (entry.sense.map(s => [s.misc].flatMap(m => m).includes('word usually written using kana alone')))
            // );
            // ctx.hiraganaDict = ctx.kanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb === wanakana.toHiragana(kana.reb))
            //     );
            // ctx.katakanaDict = ctx.kanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb === wanakana.toKatakana(kana.reb))
            //     );
            
            // ctx.hiraganaAGyou = ctx.hiraganaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb.match(/^[あ|い|う|え|お]+$/))
            //     )
            // ctx.katakanaAGyou = ctx.katakanaDict
            //     .filter(
            //         entry => entry.kana
            //             .find(kana => kana.reb.match(/^[ア|イ|ウ|エ|オ]+$/))
            //     )

            // ctx.hiraganaAGyou = ctx.dict.filter(entry => entry.tags.includes('a'));
            // ctx.hiraganaKaGyou = ctx.dict.filter(entry => entry.tags.includes('k'));
            // ctx.hiraganaSaGyou = ctx.dict.filter(entry => entry.tags.includes('s'));
            // ctx.katakanaAGyou = ctx.dict.filter(entry => entry.tags.includes('A'));
            // ctx.katakanaKaGyou = ctx.dict.filter(entry => entry.tags.includes('K'));
            // ctx.katakanaSaGyou = ctx.dict.filter(entry => entry.tags.includes('S'));

            const hiraganaGyous = ['a', 'k', 's', 't', 'n', 'h', 'm', 'y', 'r', 'w', 'nn'];
            const katakanaGyous = hiraganaGyous.map(g => g.toUpperCase());
            ctx.gyouDicts = new Map([...hiraganaGyous, ...katakanaGyous]
                .map(gyou => [gyou, dict.filter(entry => entry.tags.includes(gyou))])
            );

            // console.log(`Total: ${ctx.dict.length},
            // Kana: Not working!,
            // Hiragana: Not used right now,
            // Hiragana あ行: ${ctx.hiraganaAGyou.length},
            // Hiragana か行: ${ctx.hiraganaKaGyou.length},
            // Hiragana さ行: ${ctx.hiraganaSaGyou.length},
            // Katakana: Not used right now,
            // Katakana ア行: ${ctx.katakanaAGyou.length},
            // Katakana カ行: ${ctx.katakanaKaGyou.length},
            // Katakana サ行: ${ctx.katakanaSaGyou.length}`);

            console.log(`Total: ${ctx.dict.length}`);

            const isJlptLevelWordAndKanji = (level, entry) => entry.tags.includes(`k${level}`) && entry.tags.find(tag => [5, 4, 3, 2, 1].filter(l => l >= level).map(l => `v${l}`).includes(tag));
            [5, 4, 3, 2, 1].forEach(level => {
                ctx[`jlptN${level}Kanji`] = dict.filter(entry => entry.tags.includes(`k${level}`));
                ctx[`jlptN${level}Vocab`] = dict.filter(entry => entry.tags.includes(`v${level}`));
                ctx[`jlptN${level}`] = dict.filter(entry => isJlptLevelWordAndKanji(level, entry));
            });

            const isJlptWord = (entry) => [1, 2, 3, 4, 5].find(level => entry.tags.includes(`v${level}`));
            ctx.gyouDicts.entries().forEach(([gyouDictKey, gyouDictValue]) => {
                ctx[`jlptGyou${gyouDictKey}`] = gyouDictValue.filter(entry => isJlptWord(entry));
            });

            ctx.levelDicts = [
                ...[...hiraganaGyous, ...katakanaGyous].map(gyou => ctx.gyouDicts.get(gyou)),
                ...[5, 4, 3, 2, 1].map(level => ctx[`jlptN${level}`]),
                ctx.dict
            ];

            const hiraganaChars = [
                'あいうえおぁぃぅぇぉ',
                'かきくけこがぎぐげご',
                'さしすせそざじずぜぞ',
                'たちっつてとだぢづでど',
                'なにぬねの',
                'はひふへほばびぶべぼぱぴぷぺぽ',
                'まみむめも',
                'やゆよゃゅょ',
                'らりるれろ',
                'わを',
                'ん'
            ];
            const katakanaChars = hiraganaChars.map(chars => wanakana.toKatakana(chars));
            ctx.levelChars = [
                ...hiraganaChars,
                ...katakanaChars
            ];

            console.log(ctx);

            ctx.mode = KANA_MODE;
            ctx.currentDict = ctx.levelDicts[0];
        }

        function askRandomQuestion() {
            const previousQuestion = ctx.question;
            do {
                ctx.question = ctx.currentDict[Math.floor(Math.random() * ctx.currentDict.length)];
            } while(previousQuestion && (previousQuestion === ctx.question || (ctx.mode === KANA_MODE && ctx.question.kana.reb === previousQuestion.kana.reb)));

            const q = ctx.question;
            ctx.questionDiv.innerHTML = `
                ${formatQuestion(q)}
                <br>
                ${formatSense(q.sense)}
            `;

            console.log(q);

            ctx.giveUp = false;
            ctx.giveUpDiv.innerHTML = '';

            ctx.answerInput.focus();
        }

        function formatQuestion(question) {
            return ctx.mode === KANA_MODE ? question.kana.reb : (question.kanji.keb || question.kana.reb); 
        }

        function formatSense(sense) {
            return sense.map(s => JSON.stringify(s, null, 1).replaceAll('\n', '<br>')).join('<br><br>');
        }

        function answerSubmitted(event) {
            const input = event.target;
            const answer = input.value;

            if (!answer) {
                return;
            }

            if (wanakana.toKatakana(ctx.question.kana.reb) === wanakana.toKatakana(answer)) {
                console.log('Correct!');
                input.value = '';
                updateScore();
                askRandomQuestion();
            } else {
                console.log('Incorrect...');
            }
        }

        function textForLevel(level) {
            switch(level) {
                case 1: return 'あ行';
                case 2: return 'か行';
                case 3: return 'さ行';
                case 4: return 'た行';
                case 5: return 'な行';
                case 6: return 'は行';
                case 7: return 'ま行';
                case 8: return 'や行';
                case 9: return 'ら行';
                case 10: return 'わ行';
                case 11: return 'ん行';
                case 12: return 'ア行';
                case 13: return 'カ行';
                case 14: return 'サ行';
                case 15: return 'タ行';
                case 16: return 'ナ行';
                case 17: return 'ハ行';
                case 18: return 'マ行';
                case 19: return 'ヤ行';
                case 20: return 'ラ行';
                case 21: return 'ワ行';
                case 22: return 'ン行';
                case 23: return 'JLPT N5';
                case 24: return 'JLPT N4';
                case 25: return 'JLPT N3';
                case 26: return 'JLPT N2';
                case 27: return 'JLPT N1';
                default: return '全部';
            }
        }

        function debugLevel(level) {
            ctx.giveUp = false;
            setLevel(level);
            askRandomQuestion();
        }

        function setLevel(level) {
            ctx.score = 0;
            ctx.level = level;
            ctx.levelBarContent.style.width = '0px';

            ctx.levelText.innerHTML = `Level: ${ctx.level} ${textForLevel(ctx.level)}`;

            const levelDictIndex = Math.min(ctx.level - 1, ctx.levelDicts.length - 1);
            ctx.currentDict = ctx.levelDicts[levelDictIndex];
            if (ctx.level >= 23) {
                ctx.mode = KANJI_MODE;
                ctx.expToLevelUp = 5;
            } else {
                ctx.expToLevelUp = ctx.levelChars[levelDictIndex].length;
            }
        }
    </script>
</head>
<body onload="loadData();">
    Loading...
</body>
